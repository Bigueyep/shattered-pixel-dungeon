name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build a release APK (signed if signing secrets are set)"
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secrets can't be read in step `if:` conditions, so expose this one at job level
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the default also requests the removed 'tools' package, which fails
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :android:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pixel-dungeon-debug-${{ github.sha }}
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Sign release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          OUT=android/build/outputs/apk/release
          "$BUILD_TOOLS/zipalign" -p -f 4 "$OUT/android-release-unsigned.apk" "$OUT/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$OUT/shattered-pixel-dungeon-release.apk" \
            "$OUT/aligned.apk"
          rm "$OUT/aligned.apk" "$RUNNER_TEMP/release.jks"

      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pixel-dungeon-release-${{ github.sha }}
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error
