name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build a release APK (signed if signing secrets are set)"
        type: boolean
        default: false

concurrency:
  # branch and PR runs cancel superseded runs, but every run on the default branch gets its own
  # group so that a quick second merge never cancels the first merge's APK release
  group: build-apk-${{ github.ref }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || 'latest' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # needed to publish the APK as a GitHub release after a merge
      contents: write
    env:
      # Secrets can't be read in step `if:` conditions, so expose this one at job level
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the default also requests the removed 'tools' package, which fails
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :android:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pixel-dungeon-debug-${{ github.sha }}
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # every push to the default branch (i.e. every merged PR) publishes the APK as a release,
      # downloadable without logging in from the repository's Releases page
      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK=$(ls android/build/outputs/apk/debug/*.apk | head -n 1)
          NAME="shattered-pixel-dungeon-${GITHUB_SHA::7}-debug.apk"
          TAG="build-${{ github.run_number }}"
          cp "$APK" "$RUNNER_TEMP/$NAME"
          # default-branch runs can finish out of order, only the newest commit becomes 'Latest'
          LATEST_FLAG="--latest=false"
          HEAD_SHA=$(gh api "repos/$GH_REPO/commits/${{ github.event.repository.default_branch }}" --jq .sha || true)
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then LATEST_FLAG="--latest"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # re-run of the same workflow run: replace the asset instead of failing on the existing tag
            gh release upload "$TAG" "$RUNNER_TEMP/$NAME" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$NAME" \
              --target "$GITHUB_SHA" \
              --title "Build ${{ github.run_number }} (${GITHUB_SHA::7})" \
              --notes "Debug APK built automatically from ${GITHUB_SHA::7} on ${{ github.ref_name }}. Debug builds unlock every hero and install alongside the official app." \
              "$LATEST_FLAG"
          fi

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Sign release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          OUT=android/build/outputs/apk/release
          "$BUILD_TOOLS/zipalign" -p -f 4 "$OUT/android-release-unsigned.apk" "$OUT/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$OUT/shattered-pixel-dungeon-release.apk" \
            "$OUT/aligned.apk"
          rm "$OUT/aligned.apk" "$RUNNER_TEMP/release.jks"

      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pixel-dungeon-release-${{ github.sha }}
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error
